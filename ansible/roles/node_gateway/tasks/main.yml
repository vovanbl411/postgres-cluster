---
- name: Detect bastion private IP
  ansible.builtin.set_fact:
    gw_ip: "{{ hostvars[groups['bastion'][0]]['ansible_default_ipv4']['address'] | default(hostvars[groups['bastion'][0]]['ansible_host']) }}"

- name: Create systemd unit for default route
  ansible.builtin.copy:
    dest: /etc/systemd/system/swarm-route.service
    content: |
      [Unit]
      Description=Default route via bastion
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/sbin/ip route add default via {{ gw_ip }} dev eth1
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Enable and start route
  ansible.builtin.systemd:
    name: swarm-route
    enabled: true
    state: started
    daemon_reload: true

- name: Add route now (if not exists)
  ansible.builtin.command: /sbin/ip route add default via {{ gw_ip }} dev eth1
  register: route_add
  failed_when: route_add.rc != 0 and 'File exists' not in route_add.stderr
  changed_when: route_add.rc == 0