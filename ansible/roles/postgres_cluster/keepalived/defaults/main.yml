---
# VRRP instance
keepalived_vip: "192.168.10.100"
keepalived_interface: "eth1"
keepalived_vrid: 51
keepalived_advert_int: 1

# Authentication (TODO: move to vault)
keepalived_auth_type: "PASS"
keepalived_auth_pass: "pg_cluster_secret"

# Priority per host — explicit, no regex magic
# Override in host_vars or group_vars if hostnames change
keepalived_priority:
  pg-node-1: 101
  pg-node-2: 100
  pg-node-3: 99

# Scripts
keepalived_script_check_haproxy:
  script: "/usr/bin/killall -0 haproxy"
  interval: 2
  weight: 2

keepalived_script_check_patroni:
  script: "/usr/bin/curl -f -s -m 1 http://127.0.0.1:8008/master"
  interval: 2
  weight: 10

# Firewall — VRRP uses IP protocol 112
keepalived_firewall_rules:
  - { proto: vrrp, comment: "VRRP protocol" }