---
- name: Install Keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true

- name: Enable binding to non-local IP for HAProxy
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Deploy Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart keepalived

- name: Ensure Keepalived is enabled and running
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true

- name: Allow VRRP protocol in firewall
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    jump: ACCEPT
    comment: "{{ item.comment }}"
  loop: "{{ keepalived_firewall_rules }}"