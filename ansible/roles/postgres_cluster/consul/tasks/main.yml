---
# TODO(tech-debt): Перейти на скачивание бинарника на контроллере
# (get_url + delegate_to: localhost) вместо хардкода пути на Gentoo.
- name: Install consul binary
  ansible.builtin.copy:
    src: "{{ consul_binary_src }}"
    dest: "{{ consul_binary_dest }}"
    mode: "0755"
    owner: root
    group: root
  notify: Restart consul

- name: Create consul system group
  ansible.builtin.group:
    name: consul
    system: true
    state: present

- name: Create consul system user
  ansible.builtin.user:
    name: consul
    group: consul
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /var/lib/consul
    state: present

- name: Create consul data directory
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    owner: consul
    group: consul
    mode: '0750'

- name: Create consul configuration directory
  ansible.builtin.file:
    path: "{{ consul_config_dir }}"
    state: directory
    owner: consul
    group: consul
    mode: '0755'

- name: Deploy consul systemd unit
  ansible.builtin.template:
    src: consul.service.j2
    dest: "{{ consul_systemd_dir }}/consul.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart consul

- name: Deploy consul configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: consul
    group: consul
    mode: '0640'
  notify: Restart consul

- name: Ensure consul is enabled and running
  ansible.builtin.systemd:
    name: consul
    state: started
    enabled: true
    daemon_reload: true

- name: Open consul ports in firewall
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    comment: "{{ item.comment }}"
  loop: "{{ consul_firewall_ports }}"
  notify: Restart consul