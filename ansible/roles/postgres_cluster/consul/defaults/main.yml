---
# Версия и бинарник
consul_version: "1.19.0"
# TODO(tech-debt): Перейти на get_url с delegate_to: localhost вместо локального бинарника
consul_binary_src: "/home/vladimir/Downloads/consul"
consul_binary_dest: "/usr/local/bin/consul"

# Директории
consul_data_dir: "/opt/consul"
consul_config_dir: "/etc/consul.d"
consul_systemd_dir: "/etc/systemd/system"

# Сеть
consul_datacenter: "dc1"
consul_bind_addr: "{{ ansible_host }}"
consul_client_addr: "0.0.0.0"
consul_bootstrap_expect: 3

# Фичи
consul_ui_enabled: true
consul_connect_enabled: true
consul_log_level: "INFO"

# Firewall
consul_firewall_ports:
  - { port: 8300, proto: tcp, comment: "Consul Server RPC" }
  - { port: 8301, proto: tcp, comment: "Consul Serf LAN" }
  - { port: 8301, proto: udp, comment: "Consul Serf LAN" }
  - { port: 8302, proto: tcp, comment: "Consul Serf WAN" }
  - { port: 8302, proto: udp, comment: "Consul Serf WAN" }
  - { port: 8500, proto: tcp, comment: "Consul HTTP API / UI" }
  - { port: 8600, proto: tcp, comment: "Consul DNS" }
  - { port: 8600, proto: udp, comment: "Consul DNS" }