---
- name: Ensure monitoring group exists
  ansible.builtin.group:
    name: "{{ monitoring_group }}"
    system: true
    state: present

- name: Ensure monitoring user exists
  ansible.builtin.user:
    name: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ victoria_metrics_data_dir }}"
    state: present

# ==================== VictoriaMetrics ====================

- name: Create VictoriaMetrics data directory
  ansible.builtin.file:
    path: "{{ victoria_metrics_data_dir }}"
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0750'

- name: Ensure VictoriaMetrics bin directory exists
  ansible.builtin.file:
    path: "{{ victoria_metrics_bin_dir }}"
    state: directory
    mode: '0755'

# --- Проверка на таргете ---
- name: Check if VictoriaMetrics binary exists on target
  ansible.builtin.stat:
    path: "{{ victoria_metrics_bin_dir }}/victoria-metrics-prod"
  register: vm_binary

- name: Check VictoriaMetrics version on target
  ansible.builtin.command: "{{ victoria_metrics_bin_dir }}/victoria-metrics-prod --version"
  register: vm_version_output
  changed_when: false
  ignore_errors: true
  when: vm_binary.stat.exists

# --- Скачивание на контроллере ---
- name: Check if VictoriaMetrics binary exists on controller
  ansible.builtin.stat:
    path: "/tmp/victoria-metrics-prod"
  delegate_to: localhost
  become: false
  register: vm_local_binary

- name: Download VictoriaMetrics on controller
  ansible.builtin.get_url:
    url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ victoria_metrics_version }}/victoria-metrics-linux-amd64-v{{ victoria_metrics_version }}.tar.gz"
    dest: "/tmp/victoria-metrics-{{ victoria_metrics_version }}.tar.gz"
    mode: '0644'
    timeout: 60
  delegate_to: localhost
  become: false
  when: not vm_local_binary.stat.exists

- name: Extract VictoriaMetrics on controller
  ansible.builtin.unarchive:
    src: "/tmp/victoria-metrics-{{ victoria_metrics_version }}.tar.gz"
    dest: "/tmp/"
    remote_src: true
  delegate_to: localhost
  become: false
  when: not vm_local_binary.stat.exists

# --- Деплой на таргет ---
- name: Install VictoriaMetrics binary from controller
  ansible.builtin.copy:
    src: "/tmp/victoria-metrics-prod"
    dest: "{{ victoria_metrics_bin_dir }}/victoria-metrics-prod"
    mode: '0755'
    owner: root
    group: root
  when: >
    not vm_binary.stat.exists or
    (vm_version_output.stdout is not defined or
     victoria_metrics_version not in vm_version_output.stdout)
  notify: Restart victoriametrics

- name: Create VictoriaMetrics systemd service
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: /etc/systemd/system/victoria-metrics.service
    mode: '0644'
  notify: Restart victoriametrics

- name: Ensure VictoriaMetrics is running
  ansible.builtin.systemd:
    name: victoria-metrics
    state: started
    enabled: true
    daemon_reload: true

# ==================== Firewall ====================

- name: Allow VictoriaMetrics port
  ansible.builtin.ufw:
    rule: allow
    port: "8428"
    proto: tcp
    from_ip: "{{ monitoring_network_cidr }}"

# ==================== Build artifacts ====================

- name: Build and fetch wireguard_exporter artifact
  ansible.builtin.import_tasks: build_artifacts.yml

# ==================== Network routes (TODO: move to VPN domain) ====================

- name: Configure network routes for tunnel and VPC
  ansible.builtin.import_tasks: network_routes.yml