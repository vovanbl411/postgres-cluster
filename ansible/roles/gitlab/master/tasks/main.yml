---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
    state: present

- name: Add GitLab GPG key
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey
    dest: /etc/apt/keyrings/gitlab.asc
    mode: '0644'

- name: Add GitLab repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gitlab.asc] https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu/ noble main"
    state: present
    filename: gitlab

- name: Update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true

- name: Install GitLab CE
  ansible.builtin.apt:
    name: "gitlab-ce={{ gitlab_version }}"
    state: present

- name: Deploy gitlab.rb config
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    mode: '0600'
  notify: Reconfigure GitLab

- name: Flush handlers to apply config immediately
  ansible.builtin.meta: flush_handlers

- name: Wait for GitLab to be ready
  ansible.builtin.command: gitlab-ctl status
  register: gitlab_status
  until: gitlab_status.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Retrieve runner registration token
  ansible.builtin.shell: |
    gitlab-rails runner -e production "puts Gitlab::CurrentSettings.current_application_settings.runners_registration_token"
  register: gitlab_runner_token_raw
  changed_when: false
  no_log: true

- name: Ensure token cache directory exists on controller
  ansible.builtin.file:
    path: "{{ gitlab_token_cache_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  no_log: true


- name: Save runner token to controller cache
  ansible.builtin.copy:
    content: "{{ gitlab_runner_token_raw.stdout | trim }}"
    dest: "{{ gitlab_token_cache_dir }}/gitlab_runner_token"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  when: gitlab_runner_token_raw.stdout | length > 0

- name: Ensure GitLab is started
  ansible.builtin.systemd:
    name: gitlab-runsvdir
    state: started
    enabled: true

- name: Open GitLab ports in firewall
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "GitLab master"
  loop:
    - "{{ gitlab_http_port }}"
    - "{{ gitlab_https_port }}"
    - "{{ gitlab_ssh_port }}"
  notify: Save iptables