---
- name: Remove stale GitLab repository files
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - gitlab.list
    - gitlab-ce.list
    - gitlab_runner.list

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present

- name: Add GitLab Runner GPG key
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
    dest: /etc/apt/keyrings/gitlab-runner.asc
    mode: '0644'

- name: Add GitLab Runner repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gitlab-runner.asc] https://packages.gitlab.com/runner/gitlab-runner/ubuntu/ noble main"
    state: present
    filename: gitlab-runner

- name: Update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true

- name: Install GitLab Runner
  ansible.builtin.apt:
    name: gitlab-runner
    state: present

- name: Ensure GitLab Runner is started
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
    enabled: true

- name: Read runner token from controller cache
  ansible.builtin.slurp:
    src: "{{ gitlab_token_cache_dir }}/gitlab_runner_token"
  delegate_to: localhost
  become: false
  register: runner_token_cached
  no_log: true
  ignore_errors: true

- name: Set runner token fact from cache
  ansible.builtin.set_fact:
    gitlab_runner_token_fact: "{{ runner_token_cached.content | b64decode | trim }}"
  no_log: true
  when: runner_token_cached is succeeded

- name: Check if runner already registered
  ansible.builtin.command: gitlab-runner list
  register: runner_list
  changed_when: false

- name: Register runner (non-interactive)
  ansible.builtin.command: >
    gitlab-runner register
    --non-interactive
    --url {{ gitlab_master_url }}
    --registration-token {{ gitlab_runner_token_fact }}
    --executor {{ gitlab_runner_executor }}
    --tag-list {{ gitlab_runner_tags }}
    --run-untagged true
    --locked false
  register: runner_register
  changed_when: "'Runner registered successfully' in runner_register.stdout"
  failed_when: runner_register.rc != 0 and 'already exists' not in runner_register.stderr
  when: gitlab_runner_token_fact | default('') | length > 0