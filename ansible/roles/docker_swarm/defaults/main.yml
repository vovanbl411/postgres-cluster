---

# Сеть для Swarm overlay
docker_swarm_network: "192.168.10.0/24"

# Роль ноды: manager или worker
docker_swarm_role: "worker"

# IP менеджера (только для worker'ов)
docker_swarm_manager_ip: ""

# Токен для join (генерируется автоматически на менеджере)
docker_swarm_join_token: ""

# Версия Docker (latest если пусто)
docker_version: ""
# Порт для Swarm management
docker_swarm_port: 2377

docker_swarm_overlay_networks:
  - name: swarm-public
    attachable: true
  - name: swarm-private
    attachable: false