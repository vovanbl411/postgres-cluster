---
- name: Enable IP forwarding
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: NAT for VPC nodes
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ vpc_cidr }}"
    jump: MASQUERADE
    comment: "{{ nat_comment }}"
  notify: Save iptables

- name: Allow forward from VPC
  ansible.builtin.iptables:
    chain: FORWARD
    source: "{{ vpc_cidr }}"
    jump: ACCEPT
    comment: "Forward from VPC"
  notify: Save iptables

- name: Allow established connections back to VPC
  ansible.builtin.iptables:
    chain: FORWARD
    destination: "{{ vpc_cidr }}"
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    comment: "Established back to VPC"
  notify: Save iptables

- name: Flush handlers to persist iptables immediately
  ansible.builtin.meta: flush_handlers