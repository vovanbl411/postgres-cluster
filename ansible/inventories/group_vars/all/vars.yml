---
# Глобальные monitoring настройки
monitoring_server_host: "10.0.0.30"
monitoring_server_port: 8428
vmagent_remote_write_url: "http://{{ monitoring_server_host }}:{{ monitoring_server_port }}/api/v1/write"
scrape_interval: "15s"
monitoring_network_cidr: "10.0.0.0/24"

# Exporter ports (used by vmagent scrape config and firewall rules)
node_exporter_port: 9100
vmagent_port: 8429
wireguard_exporter_port: 9586
postgres_exporter_port: 9187

# Агенты: глобальные defaults
node_exporter_enabled: true
vmagent_enabled: true
wireguard_exporter_enabled: false
postgres_exporter_enabled: false

# WireGuard mesh registry
wg_peers:
  bastion-host:
    tunnel_ip: "10.200.0.1"
    is_hub: true
  monitoring-0:
    tunnel_ip: "10.200.0.3"
    is_hub: false
  controller-0:
    tunnel_ip: "10.200.0.2"
    is_hub: false
  pg-node-1:
    tunnel_ip: "10.200.0.4"
    is_hub: false
  pg-node-2:
    tunnel_ip: "10.200.0.5"
    is_hub: false
  pg-node-3:
    tunnel_ip: "10.200.0.6"
    is_hub: false
  gitlab-runner-1:        # ← новый spoke
    tunnel_ip: "10.200.0.10"
    is_hub: false

# Директория для ключей на контроллере
wg_keys_dir: "{{ playbook_dir }}/../.wg-keys"
