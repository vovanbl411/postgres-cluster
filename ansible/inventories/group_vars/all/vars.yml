---
# Monitoring network (для scrape config и firewall)
monitoring_network_cidr: "10.0.0.0/24"
scrape_interval: "15s"

# Exporter ports (используются vmagent scrape config + firewall)
node_exporter_port: 9100
vmagent_port: 8429
wireguard_exporter_port: 9586
postgres_exporter_port: 9187

# Активация экспортёров (если роли используют эти флаги)
node_exporter_enabled: true
vmagent_enabled: true
wireguard_exporter_enabled: false
postgres_exporter_enabled: false

# WireGuard
wg_bastion_endpoint: ""
wg_keys_dir: "{{ playbook_dir }}/../.wg-keys"

wg_peers:
  bastion-host:
    tunnel_ip: "10.200.0.1"
    is_hub: true
  monitoring-0:
    tunnel_ip: "10.200.0.3"
    is_hub: false
  controller-0:
    tunnel_ip: "10.200.0.10"
    is_hub: false
  worker-0:
    tunnel_ip: "10.200.0.11"
    is_hub: false
  worker-1:
    tunnel_ip: "10.200.0.12"
    is_hub: false
  pg-node-1:
    tunnel_ip: "10.200.0.4"
    is_hub: false
  pg-node-2:
    tunnel_ip: "10.200.0.5"
    is_hub: false
  pg-node-3:
    tunnel_ip: "10.200.0.6"
    is_hub: false
  gitlab-runner-1:
    tunnel_ip: "10.200.0.20"
    is_hub: false